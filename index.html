<style>
/* ── RESET & BASE ──────────────────────────────────────────────── */
*{box-sizing:border-box}
body{margin:0;padding:0;background:#f1f5f9;font-family:'Inter',sans-serif}

/* ── APP HEADER ────────────────────────────────────────────────── */
.app-hdr{
  display:flex;align-items:stretch;
  height:58px;padding:0 24px;
  box-shadow:0 2px 10px rgba(0,0,0,.15)
}
.hdr-brand{
  display:flex;align-items:center;gap:11px;
  flex-shrink:0;margin-right:20px;padding-right:20px;
  border-right:1px solid rgba(255,255,255,.12)
}
.brand-sub{display:block}
.desk-nav{display:flex;align-items:stretch;gap:2px;overflow-x:auto}
.hdr-space{flex:1}

/* ── PAGE LAYOUT ───────────────────────────────────────────────── */
.page-wrap{max-width:820px;margin:0 auto;padding:28px 24px}

/* ── STATS GRID ────────────────────────────────────────────────── */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}

/* ── FORM 2-COL GRID ───────────────────────────────────────────── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}

/* ── TABLE SCROLL WRAPPER ──────────────────────────────────────── */
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05)}
.tbl-body{min-width:480px;background:#fff;border-radius:8px;overflow:hidden}

/* ── EMAIL ACTIONS ─────────────────────────────────────────────── */
.email-actions{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.email-pre{font-size:14px;color:#374151;line-height:1.9;white-space:pre-wrap;font-family:Georgia,serif;margin:0}

/* ── MOBILE BOTTOM NAV ─────────────────────────────────────────── */
.mob-nav{
  display:none;
  position:fixed;bottom:0;left:0;right:0;
  background:#fff;
  border-top:1.5px solid #e5e7eb;
  z-index:200;
  padding-bottom:env(safe-area-inset-bottom,0px)
}
.mob-nav-inner{display:flex}
.mnb{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:9px 4px 7px;border:none;background:none;
  font-family:'Inter',sans-serif;
  font-size:9.5px;font-weight:500;
  color:#9ca3af;cursor:pointer;gap:3px;
  transition:color .15s;min-height:54px;
  -webkit-tap-highlight-color:transparent
}
.mnb.act{font-weight:700}
.mnb-ic{font-size:20px;line-height:1.2}

/* ── MODAL ─────────────────────────────────────────────────────── */
.modal-bd{
  display:flex;align-items:center;justify-content:center;
  padding:20px
}
.modal-box{
  background:#0f1f17;
  border:1px solid rgba(82,183,136,.22);
  padding:32px 28px;
  width:100%;max-width:440px;
  animation:mIn .28s cubic-bezier(.16,1,.3,1);
  max-height:90vh;overflow-y:auto;
  border-radius:12px
}

/* ── BREAKPOINT: TABLET 641–860px ─────────────────────────────── */
@media(max-width:860px){
  .page-wrap{padding:22px 18px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
}

/* ── BREAKPOINT: MOBILE ≤ 640px ───────────────────────────────── */
@media(max-width:640px){
  .app-hdr{padding:0 14px;height:52px}
  .hdr-brand{margin-right:0;padding-right:0;border-right:none}
  .brand-sub{display:none}
  .desk-nav{display:none}
  .hdr-space{display:none}
  .mob-nav{display:block}
  .page-wrap{padding:14px 12px 78px}
  .stats-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .form-grid{grid-template-columns:1fr}
  .hide-mob{display:none!important}
  .modal-bd{
    align-items:flex-end;
    padding:0
  }
  .modal-box{
    max-width:100%;
    max-height:92dvh;
    border-radius:20px 20px 0 0;
    padding:24px 18px
  }
  .email-pre{font-size:13px!important;line-height:1.75!important}
}

/* ── BREAKPOINT: SMALL MOBILE ≤ 400px ─────────────────────────── */
@media(max-width:400px){
  .stats-grid{gap:8px}
  .page-wrap{padding:12px 10px 78px}
}
</style>
</head>

function generarEmails(empresa, cliente, manual) {
  const emp = empresa.nombre, web = empresa.web, descripcion = empresa.descripcion;
  const firma = "Equipo " + emp + NL + web + " · " + descripcion;
  if (!cliente) {
    const nom = manual.nombre, prods = manual.productos;
    return [
      { subject:"Sus productos en " + emp + " están esperando, " + nom,
        body:"Estimado/a " + nom + "," + NN + "Le escribimos desde " + emp + " para informarle que los productos que seleccionó aún están reservados en su carrito:" + NN + prods + NN + "Puede retomar su pedido en cualquier momento en " + web + "." + NN + "Saludos cordiales," + NL + firma },
      { subject:"Recordatorio: su pedido en " + emp + " sigue disponible",
        body:"Estimado/a " + nom + "," + NN + "Han pasado 24 horas y su pedido aún está pendiente:" + NN + prods + NN + "Si tiene alguna consulta, nuestro equipo está disponible." + NN + "Saludos cordiales," + NL + firma },
      { subject:"Último aviso: su carrito en " + emp + " está por vencer",
        body:"Estimado/a " + nom + "," + NN + "Su carrito está próximo a expirar:" + NN + prods + NN + "Como gesto de bienvenida, le ofrecemos envío sin cargo si completa su pedido en las próximas 24 horas." + NN + "Saludos cordiales," + NL + firma },
    ];
  }
  const { nombre, rubro, zona, tipo, pedidos } = cliente;
  if (tipo === "frecuente") return [
    { subject: nombre + ", dejaste productos en tu carrito de " + emp,
      body: "Estimado/a equipo de " + nombre + "," + NN + "Notamos que dejaron productos sin confirmar en " + emp + ". Con " + pedidos + " pedidos realizados, son uno de nuestros clientes más activos en " + zona + "." + NN + "Su carrito sigue reservado en " + web + "." + NN + "Saludos cordiales," + NL + firma },
    { subject: "Seguimiento: pedido pendiente de " + nombre,
      body: "Estimado/a equipo de " + nombre + "," + NN + "Han pasado 24 horas desde que reservaron su último pedido. Si necesitan asistencia para coordinar entrega en " + zona + " o ajustar cantidades, estamos disponibles." + NN + "Saludos cordiales," + NL + firma },
    { subject: "Último aviso para " + nombre + " — carrito por vencer",
      body: "Estimado/a equipo de " + nombre + "," + NN + "Su carrito en " + emp + " está a punto de expirar. Como reconocimiento a su fidelidad con " + pedidos + " pedidos, les ofrecemos envío prioritario sin cargo si completan en las próximas 24 horas." + NN + "Saludos cordiales," + NL + firma },
  ];
  if (tipo === "potencial") return [
    { subject: nombre + ", sus productos en " + emp + " están esperando",
      body: "Estimado/a equipo de " + nombre + "," + NN + "Le escribimos desde " + emp + " para informarle que los productos seleccionados aún están disponibles. Nos especializamos en " + descripcion + ", ideal para negocios de " + rubro + " en " + zona + "." + NN + "Si tienen consultas antes de confirmar, estamos disponibles sin compromiso." + NN + "Saludos cordiales," + NL + firma },
    { subject: "Podemos ayudarles a completar su pedido, " + nombre,
      body: "Estimado/a equipo de " + nombre + "," + NN + "Notamos que aún no finalizaron su pedido. Muchos negocios de " + rubro + " nos consultan sobre cantidades y tiempos de entrega en " + zona + ". Nos adaptamos a lo que necesitan." + NN + "Saludos cordiales," + NL + firma },
    { subject: "Último llamado — y un beneficio para " + nombre,
      body: "Estimado/a equipo de " + nombre + "," + NN + "Su carrito en " + emp + " está próximo a vencer. Para facilitar este primer pedido, les ofrecemos envío sin cargo si lo completan en las próximas 24 horas." + NN + "Saludos cordiales," + NL + firma },
  ];
  return [
    { subject: nombre + ", hay productos en " + emp + " esperándoles",
      body: "Estimado/a equipo de " + nombre + "," + NN + "Notamos un pedido sin confirmar en " + emp + ". Como cliente activo del rubro " + rubro + " en " + zona + ", ya conocen nuestros productos. Su carrito sigue reservado en " + web + "." + NN + "Saludos cordiales," + NL + firma },

    { subject: "Última oportunidad — carrito por vencer en " + emp,
      body: "Estimado/a equipo de " + nombre + "," + NN + "Su carrito en " + emp + " está a punto de expirar. Les ofrecemos envío sin cargo si completan en las próximas 24 horas." + NN + "Saludos cordiales," + NL + firma },
  ];
}

function LoginScreen({ onLogin, empresas, onAgregarEmpresa }) {
  const lista = Object.values(empresas);
  const [selId, setSelId] = useState(lista[0]?.id || "");
  const [pass, setPass] = useState("");
  const [error, setError] = useState("");
  const [modal, setModal] = useState(false);
  const [nNombre, setNNombre] = useState("");
  const [nWeb, setNWeb] = useState("");
  const [nDesc, setNDesc] = useState("");
  const [nPass, setNPass] = useState("");
  const [nLibre, setNLibre] = useState(false);
  const [nPaleta, setNPaleta] = useState(0);
  const [nEmoji, setNEmoji] = useState("🏪");
  const [nErr, setNErr] = useState("");
  const empActual = empresas[selId] || lista[0];
  function cambiar(id) { setSelId(id); setPass(""); setError(""); }
  function ingresar() {
    if (!empActual) return;
    if (empActual.password === null) { onLogin(empActual); return; }
    if (pass === empActual.password) { onLogin(empActual); }
    else { setError("Contraseña incorrecta."); }
  }
  function crear() {
    if (!nNombre.trim()) { setNErr("El nombre es obligatorio."); return; }
    if (!nWeb.trim()) { setNErr("El sitio web es obligatorio."); return; }
    if (!nLibre && !nPass.trim()) { setNErr("Ingresá una contraseña o marcá acceso libre."); return; }
    const id = nNombre.toLowerCase().replace(/\s+/g,"_").replace(/[^a-z0-9_]/g,"") + "_" + Date.now();
    onAgregarEmpresa({ id, nombre:nNombre.trim(), password:nLibre?null:nPass.trim(), web:nWeb.trim(), descripcion:nDesc.trim()||"tienda online", colores:PALETAS[nPaleta], emoji:nEmoji, clientes:[] });
    setSelId(id); setModal(false);
    setNNombre(""); setNWeb(""); setNDesc(""); setNPass(""); setNLibre(false); setNPaleta(0); setNEmoji("🏪"); setNErr("");
  }
  const inp = { width:"100%", padding:"11px 14px", background:"rgba(255,255,255,.07)", border:"1.5px solid rgba(255,255,255,.14)", color:"#fff", fontSize:14, fontFamily:"'Inter',sans-serif", borderRadius:7, transition:"border-color .15s" };
  const inpDark = { width:"100%", padding:"10px 13px", background:"rgba(255,255,255,.05)", border:"1.5px solid rgba(255,255,255,.12)", color:"#fff", fontSize:14, fontFamily:"'Inter',sans-serif", borderRadius:7 };
  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,#0c1a12 0%,#162d1f 50%,#0c1a12 100%)",fontFamily:"'Inter',sans-serif",padding:20}}>
      <style>{`
        @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
        @keyframes mIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
        .lcard{animation:fadeUp .5s cubic-bezier(.16,1,.3,1)}
        .ebtn{transition:all .2s}
        .ebtn:hover{transform:translateY(-2px)}
        .lbtn:hover{opacity:.88;transform:translateY(-1px)}
        .lbtn{transition:all .2s}
        input:focus,textarea:focus{outline:none;border-color:rgba(82,183,136,.75)!important;box-shadow:0 0 0 3px rgba(82,183,136,.15)!important}
        button{cursor:pointer}
        ::-webkit-scrollbar{width:5px}
        ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
      `}</style>
      <div className="lcard" style={{background:"rgba(255,255,255,.055)",border:"1px solid rgba(82,183,136,.18)",backdropFilter:"blur(28px)",WebkitBackdropFilter:"blur(28px)",padding:"44px 36px",width:"100%",maxWidth:420,boxShadow:"0 32px 80px rgba(0,0,0,.55)",borderRadius:14}}>
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{display:"inline-flex",alignItems:"center",justifyContent:"center",width:52,height:52,borderRadius:13,background:"linear-gradient(135deg,#52b788,#2d6a4f)",fontSize:24,marginBottom:14,boxShadow:"0 8px 24px rgba(45,106,79,.4)"}}>📧</div>
          <div style={{color:"#fff",fontSize:24,fontWeight:700,letterSpacing:"-.03em"}}>Recartify</div>
          <div style={{color:"rgba(255,255,255,.35)",fontSize:11,letterSpacing:".2em",textTransform:"uppercase",marginTop:6,fontWeight:500}}>Plataforma multi-marca</div>
        </div>

        <div style={{marginBottom:18}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <span style={{fontSize:11,letterSpacing:".1em",textTransform:"uppercase",color:"rgba(255,255,255,.38)",fontWeight:600}}>Empresa</span>
            <button className="ebtn" onClick={()=>setModal(true)} style={{background:"rgba(255,255,255,.09)",border:"1px solid rgba(255,255,255,.14)",color:"rgba(255,255,255,.65)",fontSize:11,padding:"5px 12px",fontFamily:"'Inter',sans-serif",borderRadius:6,fontWeight:500}}>+ Nueva</button>
          </div>
          <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
            {lista.map(e=>(
              <button key={e.id} className="ebtn" onClick={()=>cambiar(e.id)} style={{flex:"1 1 calc(50% - 4px)",minWidth:0,padding:"13px 8px",border:"none",background:selId===e.id?"rgba(82,183,136,.18)":"rgba(255,255,255,.06)",color:selId===e.id?"#6dd9a8":"rgba(255,255,255,.48)",outline:selId===e.id?"1.5px solid rgba(82,183,136,.55)":"1.5px solid transparent",fontSize:12,fontFamily:"'Inter',sans-serif",borderRadius:9,transition:"all .2s",fontWeight:selId===e.id?600:400}}>
                <div style={{fontSize:20,marginBottom:5}}>{e.emoji}</div>
                <div style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontSize:11.5}}>{e.nombre}</div>
              </button>
            ))}
          </div>
        </div>

        {empActual?.password !== null ? (
          <div style={{marginBottom:18}}>
            <div style={{fontSize:11,letterSpacing:".1em",textTransform:"uppercase",color:"rgba(255,255,255,.38)",marginBottom:8,fontWeight:600}}>Contraseña</div>
            <input key={selId} type="password" value={pass} onChange={e=>{setPass(e.target.value);setError("");}} onKeyDown={e=>e.key==="Enter"&&ingresar()} placeholder="••••••••" style={inp}/>
          </div>
        ) : (
          <div style={{marginBottom:18,padding:"12px 16px",background:"rgba(82,183,136,.1)",border:"1px solid rgba(82,183,136,.2)",textAlign:"center",borderRadius:8}}>
            <span style={{color:"#6dd9a8",fontSize:12,fontWeight:500}}>✓ Acceso libre — sin contraseña</span>
          </div>
        )}
        {error && <p style={{color:"#fca5a5",fontSize:12,margin:"0 0 14px",textAlign:"center",fontWeight:500}}>⚠ {error}</p>}
        <button className="lbtn" onClick={ingresar} style={{width:"100%",padding:"13px",background:"linear-gradient(135deg,#52b788,#2d6a4f)",color:"#fff",border:"none",fontSize:13,letterSpacing:".06em",textTransform:"uppercase",fontFamily:"'Inter',sans-serif",fontWeight:700,borderRadius:8,boxShadow:"0 6px 20px rgba(45,106,79,.4)"}}>Ingresar →</button>
      </div>

      {modal && (
        <div onClick={()=>setModal(false)} className="modal-bd" style={{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",zIndex:1000}}>
          <div onClick={e=>e.stopPropagation()} className="modal-box">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:22}}>
              <div style={{color:"#fff",fontSize:16,fontWeight:700}}>+ Nueva empresa</div>
              <button onClick={()=>setModal(false)} style={{background:"rgba(255,255,255,.08)",border:"none",color:"rgba(255,255,255,.45)",fontSize:15,width:30,height:30,borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Inter',sans-serif"}}>✕</button>
            </div>
            {[["Nombre *",nNombre,setNNombre,"Ej: La Trattoria"],["Sitio web *",nWeb,setNWeb,"Ej: latrattoria.com"],["Descripción",nDesc,setNDesc,"Ej: restaurante italiano"]].map(([label,val,set,ph])=>(
              <div key={label} style={{marginBottom:14}}>
                <div style={{fontSize:11,letterSpacing:".1em",textTransform:"uppercase",color:"rgba(255,255,255,.38)",marginBottom:7,fontWeight:600}}>{label}</div>
                <input value={val} onChange={e=>set(e.target.value)} placeholder={ph} style={inpDark}/>
              </div>
            ))}
            <div style={{marginBottom:14}}>
              <div style={{fontSize:11,letterSpacing:".1em",textTransform:"uppercase",color:"rgba(255,255,255,.38)",marginBottom:7,fontWeight:600}}>Contraseña</div>
              <input type="password" value={nPass} onChange={e=>setNPass(e.target.value)} placeholder="••••••••" disabled={nLibre} style={{...inpDark,opacity:nLibre?0.35:1}}/>
              <label style={{display:"flex",alignItems:"center",gap:9,marginTop:8,cursor:"pointer"}}>
                <input type="checkbox" checked={nLibre} onChange={e=>setNLibre(e.target.checked)} style={{accentColor:"#52b788",width:14,height:14}}/>
                <span style={{fontSize:12,color:"rgba(255,255,255,.45)",fontWeight:500}}>Acceso libre</span>
              </label>
            </div>
            <div style={{marginBottom:14}}>
              <div style={{fontSize:11,letterSpacing:".1em",textTransform:"uppercase",color:"rgba(255,255,255,.38)",marginBottom:8,fontWeight:600}}>Ícono</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
                {EMOJIS.map(em=>(
                  <button key={em} onClick={()=>setNEmoji(em)} style={{width:34,height:34,fontSize:18,background:nEmoji===em?"rgba(82,183,136,.22)":"rgba(255,255,255,.06)",border:nEmoji===em?"1.5px solid rgba(82,183,136,.55)":"1.5px solid transparent",borderRadius:7,display:"flex",alignItems:"center",justifyContent:"center"}}>{em}</button>
                ))}
              </div>
            </div>
            <div style={{marginBottom:20}}>
              <div style={{fontSize:11,letterSpacing:".1em",textTransform:"uppercase",color:"rgba(255,255,255,.38)",marginBottom:8,fontWeight:600}}>Color de marca</div>
              <div style={{display:"flex",gap:9}}>
                {PALETAS.map((p,i)=>(
                  <button key={i} onClick={()=>setNPaleta(i)} style={{width:28,height:28,background:p.primario,border:nPaleta===i?"2.5px solid #fff":"2.5px solid transparent",borderRadius:"50%",boxShadow:nPaleta===i?"0 0 0 2px "+p.primario:""}}/>
                ))}
              </div>
            </div>
            {nErr && <p style={{color:"#fca5a5",fontSize:12,margin:"0 0 14px",fontWeight:500}}>⚠ {nErr}</p>}
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setModal(false)} style={{flex:1,padding:"11px",background:"rgba(255,255,255,.07)",border:"1px solid rgba(255,255,255,.13)",color:"rgba(255,255,255,.5)",fontSize:12,textTransform:"uppercase",fontFamily:"'Inter',sans-serif",fontWeight:600,borderRadius:7}}>Cancelar</button>
              <button onClick={crear} style={{flex:2,padding:"11px",background:"linear-gradient(135deg,#52b788,#2d6a4f)",border:"none",color:"#fff",fontSize:12,textTransform:"uppercase",fontFamily:"'Inter',sans-serif",fontWeight:700,borderRadius:7}}>Crear empresa →</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function AppPrincipal({ empresa, onLogout, onActualizarClientes }) {
  const C = empresa.colores;
  const [vista, setVista] = useState("generar");
  const [modo, setModo] = useState("db");
  const [busq, setBusq] = useState("");
  const [cliSel, setCliSel] = useState(null);
  const [mNom, setMNom] = useState("");
  const [mEmail, setMEmail] = useState("");
  const [mProds, setMProds] = useState("");
  const [mErr, setMErr] = useState("");
  const [emails, setEmails] = useState(null);
  const [tab, setTab] = useState(0);
  const [copied, setCopied] = useState(false);
  const [progOk, setProgOk] = useState("");
  const [progErr, setProgErr] = useState("");
  const [progLoad, setProgLoad] = useState(false);
  const [cola, setCola] = useState(null);
  const [resultados, setResultados] = useState(null);
  const [dbTab, setDbTab] = useState("lista");
  const [csvTxt, setCsvTxt] = useState("");
  const [csvErr, setCsvErr] = useState("");
  const [csvPrev, setCsvPrev] = useState([]);
  const [cNom, setCNom] = useState("");
  const [cRub, setCRub] = useState("");
  const [cZon, setCZon] = useState("");
  const [cTip, setCTip] = useState("activo");
  const [cPed, setCPed] = useState("");
  const [cEmail, setCEmail] = useState("");
  const [cErr, setCErr] = useState("");
  const [cOk, setCOk] = useState("");

  useEffect(() => {
    if (vista !== "cola" && vista !== "resultados") return;
    const load = () => fetch("/api/dashboard").then(r=>r.json()).then(d=>{ setCola(d); setResultados(d); }).catch(()=>{});
    load();
    const t = setInterval(load, 15000);
    return () => clearInterval(t);
  }, [vista]);

  const filtrados = empresa.clientes.filter(c =>
    c.nombre.toLowerCase().includes(busq.toLowerCase()) ||
    c.rubro.toLowerCase().includes(busq.toLowerCase()) ||
    c.zona.toLowerCase().includes(busq.toLowerCase())
  );

  function selCliente(c) { setCliSel(c); setEmails(generarEmails(empresa,c,null)); setTab(0); setCopied(false); setProgOk(""); setProgErr(""); setVista("generar"); }
  function genManual() {
    if (!mNom.trim()||!mProds.trim()) { setMErr("Completá nombre y productos."); return; }
    setMErr(""); setEmails(generarEmails(empresa,null,{nombre:mNom.trim(),productos:mProds.trim()})); setTab(0); setCopied(false); setProgOk(""); setProgErr("");
  }
  function copiar() {
    if (!emails) return;
    navigator.clipboard.writeText("Asunto: "+emails[tab].subject+"\n\n"+emails[tab].body);
    setCopied(true); setTimeout(()=>setCopied(false),2000);
  }
  async function programar() {
    setProgErr(""); setProgOk("");
    const clientEmail = modo==="db" ? cliSel?.email : mEmail;
    if (!clientEmail) { setProgErr("Este cliente no tiene email cargado."); return; }
    const payload = modo==="db" && cliSel ? {
      client_name: cliSel.nombre, client_email: cliSel.email,
      client_type: cliSel.tipo, client_orders: cliSel.pedidos,
      client_zona: cliSel.zona, client_rubro: cliSel.rubro,
      company_nombre: empresa.nombre, company_web: empresa.web, company_desc: empresa.descripcion,
    } : {
      client_name: mNom.trim(), client_email: mEmail.trim(), products: mProds.trim(),
      company_nombre: empresa.nombre, company_web: empresa.web, company_desc: empresa.descripcion,
    };
    setProgLoad(true);
    try {
      const res = await fetch("/api/cart-abandoned", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      const data = await res.json();
      setProgLoad(false);
      if (data.ok) { setProgOk("✓ Programado — Email 1: " + data.schedule.email_1 + " | Email 2: " + data.schedule.email_2); setTimeout(()=>setProgOk(""),8000); }
      else { setProgErr(data.error || "Error al programar"); }
    } catch(e) { setProgLoad(false); setProgErr("No se pudo conectar con el servidor"); }
  }
  function parsearCSV(txt) {
    const lineas = txt.trim().split("\n").filter(l=>l.trim());
    if (!lineas.length) return [];
    const primera = lineas[0].toLowerCase();
    const datos = (primera.includes("nombre")||primera.includes("rubro")) ? lineas.slice(1) : lineas;
    return datos.map((l,i)=>{
      const c = l.split(/[,;|\t]/).map(x=>x.trim().replace(/^"|"$/g,""));
      const ped = parseInt(c[4])||1;
      return {id:"IMP"+Date.now()+i,nombre:c[0]||"Cliente "+(i+1),rubro:c[1]||"Sin rubro",zona:c[2]||"Sin zona",tipo:c[3]||(ped>=8?"frecuente":ped>=5?"activo":"potencial"),pedidos:ped,email:c[5]||""};
    });
  }
  function prevCSV() { setCsvErr(""); if(!csvTxt.trim()){setCsvErr("Pegá el CSV primero.");return;} const p=parsearCSV(csvTxt); if(!p.length){setCsvErr("Sin datos válidos.");return;} setCsvPrev(p); }
  function importCSV() { if(!csvPrev.length)return; onActualizarClientes(empresa.id,[...empresa.clientes,...csvPrev]); setCsvPrev([]); setCsvTxt(""); setCsvErr(""); }
  function addManual() {
    if(!cNom.trim()){setCErr("Nombre obligatorio.");return;} setCErr("");
    const n={id:"MAN"+Date.now(),nombre:cNom.trim(),rubro:cRub.trim()||"Sin rubro",zona:cZon.trim()||"Sin zona",tipo:cTip,pedidos:parseInt(cPed)||1,email:cEmail.trim()||""};
    onActualizarClientes(empresa.id,[...empresa.clientes,n]);
    setCNom(""); setCRub(""); setCZon(""); setCTip("activo"); setCPed(""); setCEmail("");
    setCOk("✓ "+n.nombre+" agregado."); setTimeout(()=>setCOk(""),3000);
  }
  function delCliente(id) { onActualizarClientes(empresa.id, empresa.clientes.filter(c=>c.id!==id)); }

  const IS = { width:"100%", padding:"10px 13px", border:"1.5px solid #e5e7eb", background:"#fff", fontSize:14, color:"#111", fontFamily:"'Inter',sans-serif", borderRadius:7, transition:"border-color .15s" };
  const TABS = [{label:"Email 1",timing:"1 hora",icon:"📬"},{label:"Email 2",timing:"24 horas",icon:"🔔"},{label:"Email 3",timing:"72 horas",icon:"⏳"}];
  const stats = { total:empresa.clientes.length, frecuentes:empresa.clientes.filter(c=>c.tipo==="frecuente").length, activos:empresa.clientes.filter(c=>c.tipo==="activo").length, potenciales:empresa.clientes.filter(c=>c.tipo==="potencial").length };

  const NAV = [
    {k:"generar",label:"Emails",icon:"✉️"},
    {k:"clientes",label:"Clientes",icon:"👥"},
    {k:"basedatos",label:"Base",icon:"📂"},
    {k:"cola",label:"Cola",icon:"📊"},
    {k:"resultados",label:"Resultados",icon:"💰"},
  ];

  return (
    <div style={{minHeight:"100vh",background:"#f1f5f9",fontFamily:"'Inter',sans-serif"}}>
      <style>{`
        @keyframes fi{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
        .rc:hover{background:#f8fafc!important;cursor:pointer}
        .rc-sel{background:${C.suave}!important}
        input:focus,textarea:focus{outline:none;border-color:${C.secundario}!important;box-shadow:0 0 0 3px ${C.suave}!important}
        ::-webkit-scrollbar{width:5px}
        ::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}
        button{cursor:pointer;transition:opacity .15s,transform .15s,background .15s}
        .nav-btn:hover{background:rgba(255,255,255,.12)!important}
        .tbtn:hover{opacity:.85}
        .mnb:active{opacity:.7}
      `}</style>

      {/* ─── HEADER ─────────────────────────────────────────────────── */}
      <div className="app-hdr" style={{background:C.primario}}>
        <div className="hdr-brand">
          <div style={{width:34,height:34,borderRadius:9,background:"rgba(255,255,255,.15)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>{empresa.emoji}</div>
          <div className="brand-text">
            <div style={{color:"#fff",fontWeight:700,fontSize:13.5,letterSpacing:"-.01em",lineHeight:1.2}}>{empresa.nombre}</div>
            <div className="brand-sub" style={{color:"rgba(255,255,255,.4)",fontSize:10,letterSpacing:".05em",marginTop:2}}>{empresa.web}</div>
          </div>
        </div>
        <div className="desk-nav">
          {NAV.map(({k,label,icon})=>(
            <button key={k} className="nav-btn" onClick={()=>setVista(k)} style={{background:"none",border:"none",color:vista===k?"#fff":"rgba(255,255,255,.52)",fontSize:13,padding:"0 14px",borderBottom:vista===k?"2.5px solid rgba(255,255,255,.85)":"2.5px solid transparent",fontFamily:"'Inter',sans-serif",fontWeight:vista===k?600:400,display:"flex",alignItems:"center",gap:6,borderRadius:0,whiteSpace:"nowrap"}}>
              <span style={{fontSize:13}}>{icon}</span>{label}
            </button>
          ))}
        </div>
        <div className="hdr-space"/>
        <div style={{display:"flex",alignItems:"center"}}>
          <button className="tbtn" onClick={onLogout} style={{background:"none",border:"none",color:"rgba(255,255,255,.5)",fontSize:12,fontFamily:"'Inter',sans-serif",fontWeight:500,letterSpacing:".02em",padding:"0 4px",whiteSpace:"nowrap"}}>Salir →</button>
        </div>
      </div>

      {/* ─── MOBILE BOTTOM NAV ──────────────────────────────────────── */}
      <nav className="mob-nav">
        <div className="mob-nav-inner">
          {NAV.map(({k,label,icon})=>(
            <button key={k} className={"mnb"+(vista===k?" act":"")} onClick={()=>setVista(k)} style={{color:vista===k?C.primario:"#9ca3af"}}>
              <span className="mnb-ic">{icon}</span>
              <span>{label}</span>
            </button>
          ))}
        </div>
      </nav>

      <div className="page-wrap">

        {/* ─── CLIENTES ────────────────────────────────────────────── */}
        {vista==="clientes" && (
          <div style={{animation:"fi .3s"}}>
            <div className="stats-grid">
              {[{label:"Total",val:stats.total,color:C.primario},{label:"Frecuentes",val:stats.frecuentes,color:"#166534"},{label:"Activos",val:stats.activos,color:"#1e40af"},{label:"Potenciales",val:stats.potenciales,color:"#92400e"}].map(s=>(
                <div key={s.label} style={{background:"#fff",borderRadius:8,boxShadow:"0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05)",padding:"18px 16px",borderLeft:"4px solid "+s.color}}>
                  <div style={{fontSize:28,fontWeight:700,color:s.color,letterSpacing:"-.02em"}}>{s.val}</div>
                  <div style={{fontSize:11,color:"#9ca3af",marginTop:4,textTransform:"uppercase",letterSpacing:".06em",fontWeight:500}}>{s.label}</div>
                </div>
              ))}
            </div>
            <input value={busq} onChange={e=>setBusq(e.target.value)} placeholder="Buscar cliente, rubro o zona..." style={{...IS,marginBottom:10}}/>
            <div className="tbl-scroll">
              <div className="tbl-body">
                <div style={{display:"grid",gridTemplateColumns:"2fr 1.2fr 1fr 100px",padding:"10px 18px",background:"#f8fafc",borderBottom:"1px solid #e5e7eb",fontSize:11,letterSpacing:".1em",textTransform:"uppercase",color:"#6b7280",fontWeight:600}}>
                  <span>Cliente</span><span>Rubro</span><span>Zona</span><span>Perfil</span>
                </div>
                {filtrados.map((c)=>{ const b=TIPO_BADGE[c.tipo]||TIPO_BADGE.potencial; return (
                  <div key={c.id} className="rc" onClick={()=>selCliente(c)} style={{display:"grid",gridTemplateColumns:"2fr 1.2fr 1fr 100px",padding:"13px 18px",borderBottom:"1px solid #f1f5f9",transition:"background .12s"}}>
                    <div><div style={{fontSize:14,color:"#111",fontWeight:500}}>{c.nombre}</div><div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>{c.pedidos} pedidos</div></div>
                    <div style={{fontSize:13,color:"#4b5563",display:"flex",alignItems:"center"}}>{c.rubro}</div>
                    <div style={{fontSize:13,color:"#4b5563",display:"flex",alignItems:"center"}}>{c.zona}</div>
                    <div style={{display:"flex",alignItems:"center"}}><span style={{background:b.bg,color:b.color,border:"1px solid "+b.border,fontSize:10,padding:"3px 9px",fontWeight:600,textTransform:"uppercase",borderRadius:20,letterSpacing:".04em"}}>{c.tipo}</span></div>
                  </div>
                );})}
                {filtrados.length===0 && <div style={{padding:32,textAlign:"center",color:"#9ca3af",fontSize:14}}>Sin resultados.</div>}
              </div>
            </div>
          </div>
        )}

        {/* ─── BASE DE DATOS ───────────────────────────────────────── */}
        {vista==="basedatos" && (
          <div style={{animation:"fi .3s"}}>
            <div style={{display:"flex",background:"#fff",borderRadius:8,padding:5,gap:4,marginBottom:20,boxShadow:"0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05)"}}>
              {[{k:"lista",label:"Ver lista",icon:"📄",desc:empresa.clientes.length+" clientes"},{k:"csv",label:"Pegar CSV",icon:"📋"},{k:"manual",label:"Agregar",icon:"＋"}].map(({k,label,icon,desc})=>(
                <div key={k} onClick={()=>setDbTab(k)} style={{flex:1,padding:"11px 10px",cursor:"pointer",background:dbTab===k?C.primario:"transparent",color:dbTab===k?"#fff":C.primario,borderRadius:6,transition:"all .2s",textAlign:"center"}}>
                  <div style={{fontWeight:600,fontSize:13}}>{icon} {label}</div>
                  {desc && <div style={{fontSize:11,opacity:.7,marginTop:3}}>{desc}</div>}
                </div>
              ))}
            </div>

            {dbTab==="lista" && (
              empresa.clientes.length===0
                ? <div style={{background:"#fff",borderRadius:8,boxShadow:"0 1px 3px rgba(0,0,0,.06)",padding:40,textAlign:"center",color:"#9ca3af"}}>Sin clientes aún.</div>
                : <div className="tbl-scroll">
                    <div className="tbl-body">
                      <div style={{display:"grid",gridTemplateColumns:"2fr 1.2fr 1fr 90px 36px",padding:"10px 18px",background:"#f8fafc",borderBottom:"1px solid #e5e7eb",fontSize:11,textTransform:"uppercase",letterSpacing:".1em",color:"#6b7280",fontWeight:600}}>
                        <span>Nombre</span><span>Rubro</span><span>Zona</span><span>Perfil</span><span></span>
                      </div>
                      <div style={{maxHeight:440,overflowY:"auto"}}>
                        {empresa.clientes.map((c)=>{ const b=TIPO_BADGE[c.tipo]||TIPO_BADGE.potencial; return (
                          <div key={c.id} style={{display:"grid",gridTemplateColumns:"2fr 1.2fr 1fr 90px 36px",padding:"12px 18px",borderBottom:"1px solid #f1f5f9",alignItems:"center"}}>
                            <div><div style={{fontSize:14,color:"#111",fontWeight:500}}>{c.nombre}</div><div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>{c.pedidos} pedidos</div></div>
                            <div style={{fontSize:13,color:"#4b5563"}}>{c.rubro}</div>
                            <div style={{fontSize:13,color:"#4b5563"}}>{c.zona}</div>
                            <div><span style={{background:b.bg,color:b.color,border:"1px solid "+b.border,fontSize:10,padding:"3px 9px",fontWeight:600,textTransform:"uppercase",borderRadius:20,letterSpacing:".04em"}}>{c.tipo}</span></div>
                            <button onClick={()=>delCliente(c.id)} style={{background:"none",border:"none",color:"#d1d5db",fontSize:16,padding:0,lineHeight:1}}>&times;</button>
                          </div>
                        );})}
                      </div>
                    </div>
                  </div>
            )}
            {dbTab==="csv" && (
              <div style={{background:"#fff",borderRadius:8,boxShadow:"0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05)",padding:24}}>
                <p style={{fontSize:13,color:"#6b7280",margin:"0 0 12px",lineHeight:1.6}}>Columnas esperadas: <code style={{background:"#f1f5f9",padding:"2px 6px",borderRadius:4,fontSize:12}}>Nombre, Rubro, Zona, Tipo, Pedidos, Email</code></p>
                <textarea value={csvTxt} onChange={e=>{setCsvTxt(e.target.value);setCsvPrev([]);}} rows={6} placeholder={"Hereford,Cafetería,Montevideo,frecuente,8,hereford@hereford.com.uy"} style={{width:"100%",padding:"11px 13px",border:"1.5px solid #e5e7eb",fontSize:13,resize:"vertical",fontFamily:"monospace",borderRadius:7}}/>
                {csvErr && <p style={{color:"#b91c1c",fontSize:12,margin:"8px 0 0",fontWeight:500}}>⚠ {csvErr}</p>}
                {csvPrev.length>0 && <div style={{marginTop:12}}>
                  <div style={{fontSize:12,color:C.primario,marginBottom:8,fontWeight:600}}>{csvPrev.length} clientes listos para importar</div>
                  <button onClick={importCSV} style={{background:C.primario,color:"#fff",border:"none",padding:"10px 22px",fontSize:13,fontWeight:600,borderRadius:6}}>✓ Importar</button>
                </div>}
                {csvPrev.length===0 && <button onClick={prevCSV} style={{marginTop:12,background:C.primario,color:"#fff",border:"none",padding:"10px 22px",fontSize:13,fontWeight:600,borderRadius:6}}>Vista previa →</button>}
              </div>
            )}
            {dbTab==="manual" && (
              <div style={{background:"#fff",borderRadius:8,boxShadow:"0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05)",padding:24}}>
                <div className="form-grid">
                  {[["Nombre *",cNom,setCNom,"Ej: Café del Sur"],["Rubro",cRub,setCRub,"Ej: Cafetería"],["Zona",cZon,setCZon,"Ej: Montevideo"],["Pedidos",cPed,setCPed,"Ej: 5"],["Email",cEmail,setCEmail,"contacto@empresa.com"]].map(([lbl,val,set,ph])=>(
                    <div key={lbl}><div style={{fontSize:11,textTransform:"uppercase",color:"#6b7280",marginBottom:6,fontWeight:600,letterSpacing:".07em"}}>{lbl}</div><input value={val} onChange={e=>set(e.target.value)} placeholder={ph} style={IS}/></div>
                  ))}
                </div>
                <div style={{marginBottom:18}}>
                  <div style={{fontSize:11,textTransform:"uppercase",color:"#6b7280",marginBottom:8,fontWeight:600,letterSpacing:".07em"}}>Perfil</div>
                  <div style={{display:"flex",gap:8}}>
                    {["frecuente","activo","potencial"].map(t=>{ const b=TIPO_BADGE[t]; return (
                      <button key={t} onClick={()=>setCTip(t)} style={{flex:1,padding:"10px",border:"none",fontSize:12,fontWeight:600,textTransform:"uppercase",letterSpacing:".04em",background:cTip===t?b.bg:"#f9fafb",color:cTip===t?b.color:"#9ca3af",outline:cTip===t?"1.5px solid "+b.border:"none",borderRadius:7}}>{t}</button>
                    );})}
                  </div>
                </div>
                {cErr && <p style={{color:"#b91c1c",fontSize:12,margin:"0 0 12px",fontWeight:500}}>⚠ {cErr}</p>}
                {cOk && <p style={{color:"#166534",fontSize:12,margin:"0 0 12px",fontWeight:600}}>{cOk}</p>}
                <button onClick={addManual} style={{background:C.primario,color:"#fff",border:"none",padding:"11px 26px",fontSize:13,fontWeight:600,borderRadius:6}}>Agregar cliente</button>
              </div>
            )}
          </div>
        )}

        {/* ─── COLA ────────────────────────────────────────────────── */}
        {vista==="cola" && (
          <div style={{animation:"fi .3s"}}>
            <div style={{fontSize:18,fontWeight:700,color:"#111",marginBottom:20,letterSpacing:"-.02em"}}>📊 Cola de envío automático</div>
            {cola ? (
              <>
                <div className="stats-grid">
                  {[{label:"Registrados",val:cola.stats.total,color:C.primario},{label:"Email 1 enviados",val:cola.stats.e1||0,color:"#166534"},{label:"Email 2 enviados",val:cola.stats.e2||0,color:"#1e40af"},{label:"Email 3 enviados",val:cola.stats.e3||0,color:"#92400e"}].map(s=>(
                    <div key={s.label} style={{background:"#fff",borderRadius:8,boxShadow:"0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05)",padding:"18px 16px",borderLeft:"4px solid "+s.color}}>
                      <div style={{fontSize:28,fontWeight:700,color:s.color,letterSpacing:"-.02em"}}>{s.val}</div>
                      <div style={{fontSize:11,color:"#9ca3af",marginTop:4,textTransform:"uppercase",letterSpacing:".06em",fontWeight:500}}>{s.label}</div>
                    </div>
                  ))}
                </div>
                {cola.queue.length===0
                  ? <div style={{background:"#fff",borderRadius:8,boxShadow:"0 1px 3px rgba(0,0,0,.06)",padding:40,textAlign:"center",color:"#9ca3af",fontSize:14}}>Sin carritos registrados aún.</div>
                  : <div className="tbl-scroll">
                      <div className="tbl-body">
                        <div style={{display:"grid",gridTemplateColumns:"2fr 1.4fr 70px 70px 70px",padding:"10px 18px",background:"#f8fafc",borderBottom:"1px solid #e5e7eb",fontSize:11,textTransform:"uppercase",letterSpacing:".1em",color:"#6b7280",fontWeight:600}}>
                          <span>Cliente</span><span>Empresa</span><span style={{textAlign:"center"}}>E1</span><span style={{textAlign:"center"}}>E2</span><span style={{textAlign:"center"}}>E3</span>
                        </div>
                        <div style={{maxHeight:420,overflowY:"auto"}}>
                          {cola.queue.map((r)=>(
                            <div key={r.id} style={{display:"grid",gridTemplateColumns:"2fr 1.4fr 70px 70px 70px",padding:"13px 18px",borderBottom:"1px solid #f1f5f9",alignItems:"center"}}>
                              <div><div style={{fontSize:13,color:"#111",fontWeight:500}}>{r.client_name}</div><div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>{r.client_email}</div></div>
                              <div style={{fontSize:12,color:"#4b5563",fontWeight:500}}>{r.company_nombre}</div>
                              {[r.email_1_sent,r.email_2_sent,r.email_3_sent].map((s,j)=>(
                                <div key={j} style={{textAlign:"center"}}>
                                  <span style={{display:"inline-block",width:22,height:22,borderRadius:"50%",background:s?"#dcfce7":"#f1f5f9",border:"1.5px solid "+(s?"#86efac":"#e5e7eb"),fontSize:11,lineHeight:"20px",color:s?"#166534":"#9ca3af"}}>{s?"✓":"·"}</span>
                                </div>
                              ))}
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                }
              </>
            ) : <div style={{padding:40,textAlign:"center",color:"#9ca3af",fontSize:14}}>Cargando cola...</div>}
          </div>
        )}

        {/* ─── RESULTADOS ──────────────────────────────────────────── */}
        {vista==="resultados" && (
          <div style={{animation:"fi .3s"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:22,flexWrap:"wrap",gap:10}}>
              <div style={{fontSize:18,fontWeight:700,color:"#111",letterSpacing:"-.02em"}}>💰 Resultados de recuperación</div>
              <button onClick={()=>fetch("/api/dashboard").then(r=>r.json()).then(d=>{setCola(d);setResultados(d);})} style={{background:"#fff",border:"1.5px solid #e5e7eb",color:C.primario,padding:"8px 18px",fontSize:12,fontWeight:600,borderRadius:6,boxShadow:"0 1px 3px rgba(0,0,0,.06)"}}>↻ Actualizar</button>
            </div>
            {resultados ? (()=>{
              const s = resultados.stats;
              const tasa = s.total > 0 ? Math.round(((s.recovered||0)/s.total)*100) : 0;
              const maxMonto = resultados.byMonth?.length ? Math.max(...resultados.byMonth.map(m=>m.monto||0), 1) : 1;
              return (
                <>
                  <div className="stats-grid">
                    {[
                      {label:"Carritos",         val:s.total,                                           color:C.primario, icon:"🛒"},
                      {label:"Recuperadas",       val:s.recovered||0,                                    color:"#16a34a",  icon:"✅"},
                      {label:"Tasa",              val:tasa+"%",                                          color:"#2563eb",  icon:"📈"},
                      {label:"Ingresos",          val:"$"+(s.revenue_recovered||0).toLocaleString("es-UY"), color:"#d97706", icon:"💵"},
                    ].map(k=>(
                      <div key={k.label} style={{background:"#fff",borderRadius:8,boxShadow:"0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05)",padding:"20px 16px",borderLeft:"4px solid "+k.color}}>
                        <div style={{fontSize:13,marginBottom:10}}>{k.icon}</div>
                        <div style={{fontSize:26,fontWeight:700,color:"#111",letterSpacing:"-.02em",lineHeight:1}}>{k.val}</div>
                        <div style={{fontSize:11,color:"#9ca3af",marginTop:7,textTransform:"uppercase",letterSpacing:".06em",fontWeight:500}}>{k.label}</div>
                      </div>
                    ))}
                  </div>

                  {resultados.byMonth?.length > 0 && (
                    <div style={{background:"#fff",borderRadius:8,boxShadow:"0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05)",padding:"22px 24px",marginBottom:18}}>
                      <div style={{fontSize:13,fontWeight:700,color:"#111",marginBottom:20,letterSpacing:"-.01em"}}>Ventas recuperadas por mes</div>
                      <div style={{display:"flex",alignItems:"flex-end",gap:14,height:130}}>
                        {[...resultados.byMonth].reverse().map((m,i)=>(
                          <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:5}}>
                            <div style={{fontSize:11,color:C.primario,fontWeight:700}}>${(m.monto||0).toLocaleString("es-UY")}</div>
                            <div style={{width:"100%",background:C.secundario,height:Math.max(10,Math.round((m.monto/maxMonto)*96)),borderRadius:"5px 5px 0 0",minHeight:10,opacity:.85}}/>
                            <div style={{fontSize:10,color:"#6b7280",fontWeight:500}}>{m.mes}</div>
                            <div style={{fontSize:10,color:"#9ca3af"}}>{m.ventas} venta{m.ventas!==1?"s":""}</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  <div className="tbl-scroll" style={{marginBottom:14}}>
                    <div className="tbl-body">
                      <div style={{padding:"13px 18px",background:C.primario,color:"#fff",fontSize:12,fontWeight:600,textTransform:"uppercase",letterSpacing:".08em"}}>
                        Historial de ventas recuperadas
                      </div>
                      {(resultados.queue||[]).filter(r=>r.recovered).length === 0
                        ? <div style={{padding:40,textAlign:"center",color:"#9ca3af",fontSize:14,lineHeight:1.8,background:"#fff"}}>
                            Aún no hay ventas recuperadas.<br/>
                            <span style={{fontSize:12,color:"#d1d5db"}}>Cuando un cliente complete una compra después de recibir un email, aparecerá acá.</span>
                          </div>
                        : <>
                            <div style={{display:"grid",gridTemplateColumns:"2fr 1.4fr 1fr 100px",padding:"10px 18px",background:"#f8fafc",borderBottom:"1px solid #e5e7eb",fontSize:11,textTransform:"uppercase",letterSpacing:".1em",color:"#6b7280",fontWeight:600}}>
                              <span>Cliente</span><span>Empresa</span><span>Fecha</span><span style={{textAlign:"right"}}>Monto</span>
                            </div>
                            <div style={{maxHeight:380,overflowY:"auto",background:"#fff"}}>
                              {(resultados.queue||[]).filter(r=>r.recovered).map((r)=>(
                                <div key={r.id} style={{display:"grid",gridTemplateColumns:"2fr 1.4fr 1fr 100px",padding:"13px 18px",borderBottom:"1px solid #f1f5f9",alignItems:"center"}}>
                                  <div>
                                    <div style={{fontSize:13,color:"#111",fontWeight:500}}>{r.client_name}</div>
                                    <div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>{r.client_email}</div>
                                  </div>
                                  <div style={{fontSize:12,color:"#4b5563",fontWeight:500}}>{r.company_nombre}</div>
                                  <div style={{fontSize:11,color:"#6b7280"}}>{r.recovered_at ? new Date(r.recovered_at*1000).toLocaleDateString("es-UY") : "—"}</div>
                                  <div style={{fontSize:13,fontWeight:700,color:"#16a34a",textAlign:"right"}}>${(r.order_value||0).toLocaleString("es-UY")}</div>
                                </div>
                              ))}
                            </div>
                          </>
                      }
                    </div>
                  </div>

                  <div style={{padding:"16px 18px",background:"#f8fafc",border:"1px solid #e5e7eb",fontSize:12,color:"#6b7280",lineHeight:1.9,borderRadius:8}}>
                    <strong style={{color:C.primario,fontWeight:600}}>¿Cómo se detecta una venta recuperada?</strong><br/>
                    Cuando un cliente completa la compra, la tienda envía un webhook a <code style={{background:"#f1f5f9",padding:"2px 6px",fontSize:11,borderRadius:4,fontFamily:"monospace"}}>/api/cart-completed</code> con el email y el monto. El sistema verifica que ese cliente haya recibido al menos un email de recuperación, y recién entonces contabiliza la venta.
                  </div>
                </>
              );
            })() : <div style={{padding:40,textAlign:"center",color:"#9ca3af",fontSize:14}}>Cargando...</div>}
          </div>
        )}

        {/* ─── GENERAR EMAILS ──────────────────────────────────────── */}
        {vista==="generar" && (
          <div style={{animation:"fi .3s"}}>
            <div style={{display:"flex",background:"#fff",borderRadius:8,padding:5,gap:4,marginBottom:20,boxShadow:"0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05)"}}>
              {[{k:"db",label:"Desde base de clientes",icon:"👥"},{k:"manual",label:"Ingreso manual",icon:"✏️"}].map(({k,label,icon})=>(
                <div key={k} onClick={()=>{setModo(k);setEmails(null);setCliSel(null);setProgOk("");setProgErr("");}} style={{flex:1,padding:"11px 10px",cursor:"pointer",background:modo===k?C.primario:"transparent",color:modo===k?"#fff":C.primario,fontSize:13,fontWeight:600,borderRadius:6,display:"flex",alignItems:"center",gap:7,justifyContent:"center",transition:"all .2s",textAlign:"center"}}>
                  <span>{icon}</span><span>{label}</span>
                </div>
              ))}
            </div>

            {modo==="db" && (
              <div style={{marginBottom:18}}>
                <input value={busq} onChange={e=>setBusq(e.target.value)} placeholder="Buscar cliente..." style={{...IS,marginBottom:10}}/>
                <div className="tbl-scroll">
                  <div className="tbl-body" style={{maxHeight:280}}>
                    <div style={{display:"grid",gridTemplateColumns:"2fr 1.2fr 1fr 100px",padding:"10px 18px",background:"#f8fafc",borderBottom:"1px solid #e5e7eb",fontSize:11,textTransform:"uppercase",letterSpacing:".1em",color:"#6b7280",fontWeight:600,position:"sticky",top:0}}>
                      <span>Cliente</span><span>Rubro</span><span>Zona</span><span>Perfil</span>
                    </div>
                    <div style={{overflowY:"auto",maxHeight:240}}>
                      {filtrados.map((c)=>{ const b=TIPO_BADGE[c.tipo]||TIPO_BADGE.potencial; const sel=cliSel?.id===c.id; return (
                        <div key={c.id} className={"rc"+(sel?" rc-sel":"")} onClick={()=>selCliente(c)} style={{display:"grid",gridTemplateColumns:"2fr 1.2fr 1fr 100px",padding:"12px 18px",borderBottom:"1px solid #f1f5f9",transition:"background .12s",borderLeft:sel?"3px solid "+C.primario:"3px solid transparent"}}>
                          <div><div style={{fontSize:14,color:"#111",fontWeight:sel?600:500}}>{c.nombre}</div><div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>{c.pedidos} pedidos</div></div>
                          <div style={{fontSize:13,color:"#4b5563",display:"flex",alignItems:"center"}}>{c.rubro}</div>
                          <div style={{fontSize:13,color:"#4b5563",display:"flex",alignItems:"center"}}>{c.zona}</div>
                          <div style={{display:"flex",alignItems:"center"}}><span style={{background:b.bg,color:b.color,border:"1px solid "+b.border,fontSize:10,padding:"3px 9px",fontWeight:600,textTransform:"uppercase",borderRadius:20,letterSpacing:".04em"}}>{c.tipo}</span></div>
                        </div>
                      );})}
                      {filtrados.length===0 && <div style={{padding:24,textAlign:"center",color:"#9ca3af",fontSize:13}}>Sin resultados.</div>}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {modo==="manual" && (
              <div style={{background:"#fff",borderRadius:8,boxShadow:"0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05)",padding:24,marginBottom:18}}>
                {[["Nombre del cliente","text",mNom,setMNom,"Ej: Café del Centro"],["Email del cliente","email",mEmail,setMEmail,"Ej: contacto@cafe.com"]].map(([lbl,type,val,set,ph])=>(
                  <div key={lbl} style={{marginBottom:14}}>
                    <div style={{fontSize:11,textTransform:"uppercase",color:"#6b7280",marginBottom:7,fontWeight:600,letterSpacing:".07em"}}>{lbl}</div>
                    <input type={type} value={val} onChange={e=>set(e.target.value)} placeholder={ph} style={IS}/>
                  </div>
                ))}
                <div style={{marginBottom:18}}>
                  <div style={{fontSize:11,textTransform:"uppercase",color:"#6b7280",marginBottom:7,fontWeight:600,letterSpacing:".07em"}}>Productos en el carrito</div>
                  <textarea value={mProds} onChange={e=>setMProds(e.target.value)} rows={3} placeholder={"Ej: 500x Bowl compostable 750ml"} style={{...IS,resize:"vertical"}}/>
                </div>
                {mErr && <p style={{color:"#b91c1c",fontSize:12,margin:"0 0 14px",fontWeight:500}}>⚠ {mErr}</p>}
                <button onClick={genManual} style={{background:C.primario,color:"#fff",border:"none",padding:"11px 24px",fontSize:13,fontWeight:600,borderRadius:6}}>Generar emails →</button>
              </div>
            )}

            {emails && (
              <div style={{animation:"fi .3s"}}>
                <div style={{display:"flex",background:"#f8fafc",borderRadius:"8px 8px 0 0",overflow:"hidden",border:"1px solid #e5e7eb",borderBottom:"none"}}>
                  {TABS.map((t,i)=>(
                    <div key={i} onClick={()=>{setTab(i);setCopied(false);}} style={{flex:1,padding:"13px 8px",textAlign:"center",cursor:"pointer",background:tab===i?"#fff":"transparent",color:tab===i?C.primario:"#9ca3af",borderRight:i<2?"1px solid #e5e7eb":"none",fontSize:12,fontWeight:tab===i?700:400,transition:"all .2s",borderBottom:tab===i?"2.5px solid "+C.secundario:"2.5px solid transparent"}}>
                      <div style={{fontSize:18,marginBottom:4}}>{t.icon}</div>
                      <div>{t.label}</div>
                      <div style={{fontSize:10,opacity:.55,marginTop:2}}>{t.timing} después</div>
                    </div>
                  ))}
                </div>
                <div style={{background:"#fff",border:"1px solid #e5e7eb",borderTop:"none",borderRadius:"0 0 8px 8px",padding:"24px 20px",boxShadow:"0 4px 14px rgba(0,0,0,.05)"}}>
                  <div style={{marginBottom:16,paddingBottom:14,borderBottom:"1px solid #f1f5f9"}}>
                    <div style={{fontSize:11,textTransform:"uppercase",color:C.secundario,marginBottom:5,fontWeight:600,letterSpacing:".08em"}}>Asunto</div>
                    <div style={{fontSize:16,color:"#111",fontWeight:700,lineHeight:1.4}}>{emails[tab].subject}</div>
                  </div>
                  <pre className="email-pre">{emails[tab].body}</pre>
                  <div style={{marginTop:22,borderTop:"1px solid #f1f5f9",paddingTop:18}}>
                    <div className="email-actions">
                      <button onClick={copiar} style={{background:"#fff",border:"1.5px solid #e5e7eb",color:C.primario,padding:"10px 18px",fontSize:12,fontWeight:600,borderRadius:6}}>{copied?"✓ Copiado":"Copiar email"}</button>
                      {(cliSel?.email||mEmail) && (
                        <button onClick={()=>{const e=emails[tab];window.open("https://mail.google.com/mail/?view=cm&to="+encodeURIComponent(cliSel?.email||mEmail)+"&su="+encodeURIComponent(e.subject)+"&body="+encodeURIComponent(e.body),"_blank");}} style={{background:"#ea4335",color:"#fff",border:"none",padding:"10px 18px",fontSize:12,fontWeight:600,borderRadius:6}}>✉️ Abrir en Gmail</button>
                      )}
                    </div>
                    <div style={{background:C.suave,border:"1px solid "+C.medio,padding:"18px 20px",borderRadius:8}}>
                      <div style={{fontSize:11,textTransform:"uppercase",color:C.primario,fontWeight:700,marginBottom:6,letterSpacing:".08em"}}>🤖 Envío automático</div>
                      <div style={{fontSize:13,color:"#4b5563",marginBottom:14,lineHeight:1.6}}>El servidor envía los 3 emails solo: <strong>1h · 24h · 72h</strong> después del abandono</div>
                      <button onClick={programar} disabled={progLoad} style={{background:C.primario,color:"#fff",border:"none",padding:"10px 22px",fontSize:13,fontWeight:600,borderRadius:6,opacity:progLoad?0.6:1}}>
                        {progLoad?"Programando...":"Programar envío →"}
                      </button>
                      {progOk && <div style={{marginTop:12,padding:"10px 14px",background:"#dcfce7",color:"#166534",fontSize:12,borderRadius:6,fontWeight:500}}>{progOk}</div>}
                      {progErr && <div style={{marginTop:12,padding:"10px 14px",background:"#fee2e2",color:"#b91c1c",fontSize:12,borderRadius:6,fontWeight:500}}>⚠ {progErr}</div>}
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function App() {
  const [empresa, setEmpresa] = useState(null);
  const [empresas, setEmpresas] = useState(EMPRESAS_BASE);
  function agregarEmpresa(nueva) { setEmpresas(prev=>({...prev,[nueva.id]:nueva})); }
  function actualizarClientes(empId, nuevos) {
    setEmpresas(prev=>({...prev,[empId]:{...prev[empId],clientes:nuevos}}));
    if (empresa?.id===empId) setEmpresa(prev=>({...prev,clientes:nuevos}));
  }
  return empresa
    ? <AppPrincipal empresa={empresa} onLogout={()=>setEmpresa(null)} onActualizarClientes={actualizarClientes}/>
    : <LoginScreen onLogin={setEmpresa} empresas={empresas} onAgregarEmpresa={agregarEmpresa}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>

function generarEmails(empresa, cliente, manual) {
  const emp = empresa.nombre, web = empresa.web, descripcion = empresa.descripcion;
  const firma = "Equipo " + emp + NL + web + " · " + descripcion;
  if (!cliente) {
    const nom = manual.nombre, prods = manual.productos;
    return [
      { subject:"Sus productos en " + emp + " están esperando, " + nom,
        body:"Estimado/a " + nom + "," + NN + "Le escribimos desde " + emp + " para informarle que los productos que seleccionó aún están reservados en su carrito:" + NN + prods + NN + "Puede retomar su pedido en cualquier momento en " + web + "." + NN + "Saludos cordiales," + NL + firma },
      { subject:"Recordatorio: su pedido en " + emp + " sigue disponible",
        body:"Estimado/a " + nom + "," + NN + "Han pasado 24 horas y su pedido aún está pendiente:" + NN + prods + NN + "Si tiene alguna consulta, nuestro equipo está disponible." + NN + "Saludos cordiales," + NL + firma },
      { subject:"Último aviso: su carrito en " + emp + " está por vencer",
        body:"Estimado/a " + nom + "," + NN + "Su carrito está próximo a expirar:" + NN + prods + NN + "Como gesto de bienvenida, le ofrecemos envío sin cargo si completa su pedido en las próximas 24 horas." + NN + "Saludos cordiales," + NL + firma },
    ];
  }
  const { nombre, rubro, zona, tipo, pedidos } = cliente;
  if (tipo === "frecuente") return [
    { subject: nombre + ", dejaste productos en tu carrito de " + emp,
      body: "Estimado/a equipo de " + nombre + "," + NN + "Notamos que dejaron productos sin confirmar en " + emp + ". Con " + pedidos + " pedidos realizados, son uno de nuestros clientes más activos en " + zona + "." + NN + "Su carrito sigue reservado en " + web + "." + NN + "Saludos cordiales," + NL + firma },
    { subject: "Seguimiento: pedido pendiente de " + nombre,
      body: "Estimado/a equipo de " + nombre + "," + NN + "Han pasado 24 horas desde que reservaron su último pedido. Si necesitan asistencia para coordinar entrega en " + zona + " o ajustar cantidades, estamos disponibles." + NN + "Saludos cordiales," + NL + firma },
    { subject: "Último aviso para " + nombre + " — carrito por vencer",
      body: "Estimado/a equipo de " + nombre + "," + NN + "Su carrito en " + emp + " está a punto de expirar. Como reconocimiento a su fidelidad con " + pedidos + " pedidos, les ofrecemos envío prioritario sin cargo si completan en las próximas 24 horas." + NN + "Saludos cordiales," + NL + firma },
  ];
  if (tipo === "potencial") return [
    { subject: nombre + ", sus productos en " + emp + " están esperando",
      body: "Estimado/a equipo de " + nombre + "," + NN + "Le escribimos desde " + emp + " para informarle que los productos seleccionados aún están disponibles. Nos especializamos en " + descripcion + ", ideal para negocios de " + rubro + " en " + zona + "." + NN + "Si tienen consultas antes de confirmar, estamos disponibles sin compromiso." + NN + "Saludos cordiales," + NL + firma },
    { subject: "Podemos ayudarles a completar su pedido, " + nombre,
      body: "Estimado/a equipo de " + nombre + "," + NN + "Notamos que aún no finalizaron su pedido. Muchos negocios de " + rubro + " nos consultan sobre cantidades y tiempos de entrega en " + zona + ". Nos adaptamos a lo que necesitan." + NN + "Saludos cordiales," + NL + firma },
    { subject: "Último llamado — y un beneficio para " + nombre,
      body: "Estimado/a equipo de " + nombre + "," + NN + "Su carrito en " + emp + " está próximo a vencer. Para facilitar este primer pedido, les ofrecemos envío sin cargo si lo completan en las próximas 24 horas." + NN + "Saludos cordiales," + NL + firma },
  ];
  return [
    { subject: nombre + ", hay productos en " + emp + " esperándoles",
      body: "Estimado/a equipo de " + nombre + "," + NN + "Notamos un pedido sin confirmar en " + emp + ". Como cliente activo del rubro " + rubro + " en " + zona + ", ya conocen nuestros productos. Su carrito sigue reservado en " + web + "." + NN + "Saludos cordiales," + NL + firma },
    { subject: "Recordatorio " + emp + " para " + nombre + " — 24 horas",
      body: "Estimado/a equipo de " + nombre + "," + NN + "Han pasado 24 horas desde que reservaron su pedido. Si surgió alguna duda sobre productos o logística en " + zona + ", nuestro equipo puede orientarles." + NN + "Saludos cordiales," + NL + firma },
    { subject: "Última oportunidad — carrito por vencer en " + emp,
      body: "Estimado/a equipo de " + nombre + "," + NN + "Su carrito en " + emp + " está a punto de expirar. Les ofrecemos envío sin cargo si completan en las próximas 24 horas." + NN + "Saludos cordiales," + NL + firma },
  ];
}

    if (!empActual) return;
    if (empActual.password === null) { onLogin(empActual); return; }

    else setError("Contraseña incorrecta.");

                  <div style={{background:"#fff",borderRadius:10,boxShadow:"0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05)",overflow:"hidden",marginBottom:14}}>
                    <div style={{padding:"14px 18px",background:C.primario,color:"#fff",fontSize:12,fontWeight:700,textTransform:"uppercase",letterSpacing:".08em"}}>Historial de ventas recuperadas</div>
                    {(resultados.queue||[]).filter(r=>r.recovered).length===0?
                      <div style={{padding:40,textAlign:"center",color:"#9ca3af",lineHeight:1.8}}>Aún no hay ventas recuperadas.<br/><span style={{fontSize:12,color:"#d1d5db"}}>Cuando un cliente compre después de recibir un email, aparecerá acá.</span></div>:
                      <div style={{maxHeight:360,overflowY:"auto"}}>
                        <div style={{display:"grid",gridTemplateColumns:"2fr 1.4fr 1fr 100px",padding:"11px 18px",background:"#f8fafc",borderBottom:"1px solid #e5e7eb",fontSize:11,textTransform:"uppercase",letterSpacing:".1em",color:"#6b7280",fontWeight:700}}>
                          <span>Cliente</span><span>Empresa</span><span>Fecha</span><span style={{textAlign:"right"}}>Monto</span>
                        </div>
                        {(resultados.queue||[]).filter(r=>r.recovered).map((r)=>(
                          <div key={r.id} style={{display:"grid",gridTemplateColumns:"2fr 1.4fr 1fr 100px",padding:"13px 18px",borderBottom:"1px solid #f1f5f9",alignItems:"center"}}>
                            <div><div style={{fontSize:13,color:"#111",fontWeight:500}}>{r.client_name}</div><div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>{r.client_email}</div></div>
                            <div style={{fontSize:12,color:"#4b5563",fontWeight:500}}>{r.company_nombre}</div>
                            <div style={{fontSize:11,color:"#6b7280"}}>{r.recovered_at?new Date(r.recovered_at*1000).toLocaleDateString("es-UY"):"—"}</div>
                            <div style={{fontSize:13,fontWeight:800,color:"#16a34a",textAlign:"right"}}>${(r.order_value||0).toLocaleString("es-UY")}</div>
                          </div>
                        ))}
                      </div>
                    }
                  </div>
                  <div style={{padding:"16px 18px",background:"#f8fafc",border:"1px solid #e5e7eb",fontSize:12,color:"#6b7280",lineHeight:1.9,borderRadius:10}}>
                    <strong style={{color:C.primario,fontWeight:700}}>¿Cómo se detecta una venta recuperada?</strong><br/>
                    Cuando el cliente completa la compra, tu tienda envía un webhook a <code style={{background:"#f1f5f9",padding:"2px 6px",fontSize:11,borderRadius:4,fontFamily:"monospace"}}>/api/cart-completed</code> con el email y el monto. El sistema verifica que ese cliente haya recibido al menos un email, y recién entonces contabiliza la venta.
                  </div>
                </>);
              })():<div style={{padding:40,textAlign:"center",color:"#9ca3af"}}>Cargando...</div>}
            </div>
          )}

          {/* GENERAR EMAILS */}
          {vista==="generar" && (
            <div style={{animation:"fi .3s"}}>
              <div style={{marginBottom:24}}><h1 style={{margin:0,fontSize:24,fontWeight:800,color:"#0f172a",letterSpacing:"-.03em"}}>✉️ Generar emails</h1><p style={{margin:"7px 0 0",fontSize:13.5,color:"#64748b"}}>Creá la secuencia personalizada para cada cliente</p></div>
              <div style={{display:"flex",background:"#fff",borderRadius:10,padding:5,gap:4,marginBottom:20,boxShadow:"0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05)"}}>
                {[{k:"db",label:"Base de clientes",icon:"👥"},{k:"manual",label:"Ingreso manual",icon:"✏️"}].map(({k,label,icon})=>(
                  <div key={k} onClick={()=>{setModo(k);setEmails(null);setCliSel(null);setProgOk("");setProgErr("");}} style={{flex:1,padding:"11px 16px",cursor:"pointer",background:modo===k?C.primario:"transparent",color:modo===k?"#fff":C.primario,fontSize:13,fontWeight:700,borderRadius:7,display:"flex",alignItems:"center",gap:7,justifyContent:"center",transition:"all .2s"}}>
                    <span>{icon}</span>{label}
                  </div>
                ))}
              </div>
              {modo==="db"&&(
                <div style={{marginBottom:18}}>
                  <input value={busq} onChange={e=>setBusq(e.target.value)} placeholder="Buscar cliente..." style={{...IS,marginBottom:10}}/>
                  <div style={{background:"#fff",borderRadius:10,boxShadow:"0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05)",overflow:"hidden",maxHeight:300}}>
                    <div style={{display:"grid",gridTemplateColumns:"2fr 1.2fr 1fr 100px",padding:"11px 18px",background:"#f8fafc",borderBottom:"1px solid #e5e7eb",fontSize:11,textTransform:"uppercase",letterSpacing:".1em",color:"#6b7280",fontWeight:700,position:"sticky",top:0}}>
                      <span>Cliente</span><span>Rubro</span><span>Zona</span><span>Perfil</span>
                    </div>
                    <div style={{overflowY:"auto",maxHeight:260}}>
                      {filtrados.map((c)=>{const b=TIPO_BADGE[c.tipo]||TIPO_BADGE.potencial;const sel=cliSel?.id===c.id;return(
                        <div key={c.id} className="rc" onClick={()=>selCliente(c)} style={{display:"grid",gridTemplateColumns:"2fr 1.2fr 1fr 100px",padding:"12px 18px",borderBottom:"1px solid #f1f5f9",transition:"background .12s",borderLeft:sel?"3px solid "+C.primario:"3px solid transparent",background:sel?C.suave:"#fff"}}>
                          <div><div style={{fontSize:14,color:"#111",fontWeight:sel?700:500}}>{c.nombre}</div><div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>{c.pedidos} pedidos</div></div>
                          <div style={{fontSize:13,color:"#4b5563",display:"flex",alignItems:"center"}}>{c.rubro}</div>
                          <div style={{fontSize:13,color:"#4b5563",display:"flex",alignItems:"center"}}>{c.zona}</div>
                          <div style={{display:"flex",alignItems:"center"}}><span style={{background:b.bg,color:b.color,border:"1px solid "+b.border,fontSize:10,padding:"3px 10px",fontWeight:700,textTransform:"uppercase",borderRadius:20}}>{c.tipo}</span></div>
                        </div>
                      );})}
                      {filtrados.length===0&&<div style={{padding:24,textAlign:"center",color:"#9ca3af",fontSize:13}}>Sin resultados.</div>}
                    </div>
                  </div>
                </div>
              )}
              {modo==="manual"&&(
                <div style={{background:"#fff",borderRadius:10,boxShadow:"0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05)",padding:24,marginBottom:18}}>
                  {[["Nombre del cliente","text",mNom,setMNom,"Ej: Café del Centro"],["Email del cliente","email",mEmail,setMEmail,"Ej: contacto@cafe.com"]].map(([lbl,type,val,set,ph])=>(
                    <div key={lbl} style={{marginBottom:14}}>
                      <div style={{fontSize:11,textTransform:"uppercase",color:"#6b7280",marginBottom:7,fontWeight:700,letterSpacing:".07em"}}>{lbl}</div>
                      <input type={type} value={val} onChange={e=>set(e.target.value)} placeholder={ph} style={IS}/>
                    </div>
                  ))}
                  <div style={{marginBottom:18}}>
                    <div style={{fontSize:11,textTransform:"uppercase",color:"#6b7280",marginBottom:7,fontWeight:700,letterSpacing:".07em"}}>Productos en el carrito</div>
                    <textarea value={mProds} onChange={e=>setMProds(e.target.value)} rows={3} placeholder={"Ej: 500x Bowl compostable 750ml"} style={{...IS,resize:"vertical"}}/>
                  </div>
                  {mErr&&<p style={{color:"#b91c1c",fontSize:12,margin:"0 0 14px",fontWeight:600}}>⚠ {mErr}</p>}
                  <button onClick={genManual} style={{background:C.primario,color:"#fff",border:"none",padding:"11px 24px",fontSize:13,fontWeight:700,borderRadius:8}}>Generar emails →</button>
                </div>
              )}
              {emails&&(
                <div style={{animation:"fi .3s"}}>
                  <div style={{display:"flex",background:"#f8fafc",borderRadius:"10px 10px 0 0",overflow:"hidden",border:"1px solid #e5e7eb",borderBottom:"none"}}>
                    {TABS.map((t,i)=>(
                      <div key={i} onClick={()=>{setTab(i);setCopied(false);}} style={{flex:1,padding:"13px 8px",textAlign:"center",cursor:"pointer",background:tab===i?"#fff":"transparent",color:tab===i?C.primario:"#9ca3af",borderRight:i<2?"1px solid #e5e7eb":"none",fontSize:12,fontWeight:tab===i?700:400,transition:"all .2s",borderBottom:tab===i?"2.5px solid "+C.secundario:"2.5px solid transparent"}}>
                        <div style={{fontSize:18,marginBottom:4}}>{t.icon}</div>
                        <div>{t.label}</div>
                        <div style={{fontSize:10,opacity:.55,marginTop:2}}>{t.timing} después</div>
                      </div>
                    ))}
                  </div>
                  <div style={{background:"#fff",border:"1px solid #e5e7eb",borderTop:"none",borderRadius:"0 0 10px 10px",padding:"24px 26px",boxShadow:"0 4px 14px rgba(0,0,0,.05)"}}>
                    <div style={{marginBottom:16,paddingBottom:14,borderBottom:"1px solid #f1f5f9"}}>
                      <div style={{fontSize:11,textTransform:"uppercase",color:C.secundario,marginBottom:5,fontWeight:700,letterSpacing:".08em"}}>Asunto</div>
                      <div style={{fontSize:16,color:"#111",fontWeight:700,lineHeight:1.4}}>{emails[tab].subject}</div>
                    </div>
                    <pre style={{fontSize:14,color:"#374151",lineHeight:1.9,whiteSpace:"pre-wrap",fontFamily:"Georgia,serif",margin:0}}>{emails[tab].body}</pre>
                    <div style={{marginTop:22,borderTop:"1px solid #f1f5f9",paddingTop:18}}>
                      <div style={{display:"flex",gap:10,marginBottom:16}}>
                        <button onClick={copiar} style={{background:"#fff",border:"1.5px solid #e5e7eb",color:C.primario,padding:"9px 18px",fontSize:12,fontWeight:700,borderRadius:7}}>{copied?"✓ Copiado":"Copiar email"}</button>
                        {(cliSel?.email||mEmail)&&(<button onClick={()=>{const e=emails[tab];window.open("https://mail.google.com/mail/?view=cm&to="+encodeURIComponent(cliSel?.email||mEmail)+"&su="+encodeURIComponent(e.subject)+"&body="+encodeURIComponent(e.body),"_blank");}} style={{background:"#ea4335",color:"#fff",border:"none",padding:"9px 18px",fontSize:12,fontWeight:700,borderRadius:7}}>✉️ Abrir en Gmail</button>)}
                      </div>
                      <div style={{background:C.suave,border:"1px solid "+C.medio,padding:"18px 20px",borderRadius:10}}>
                        <div style={{fontSize:11,textTransform:"uppercase",color:C.primario,fontWeight:800,marginBottom:6,letterSpacing:".08em"}}>🤖 Envío automático</div>
                        <div style={{fontSize:13,color:"#4b5563",marginBottom:14,lineHeight:1.6}}>El servidor envía los 3 emails solo: <strong>1h · 24h · 72h</strong> después del abandono</div>
                        <button onClick={programar} disabled={progLoad} style={{background:C.primario,color:"#fff",border:"none",padding:"10px 22px",fontSize:13,fontWeight:700,borderRadius:7,opacity:progLoad?0.6:1}}>
                          {progLoad?"Programando...":"Programar envío →"}
                        </button>
                        {progOk&&<div style={{marginTop:12,padding:"10px 14px",background:"#dcfce7",color:"#166534",fontSize:12,borderRadius:7,fontWeight:600}}>{progOk}</div>}
                        {progErr&&<div style={{marginTop:12,padding:"10px 14px",background:"#fee2e2",color:"#b91c1c",fontSize:12,borderRadius:7,fontWeight:600}}>⚠ {progErr}</div>}
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [empresa, setEmpresa] = useState(null);
  const [empresas, setEmpresas] = useState(() => {
    try {
      const saved = localStorage.getItem("recartify_empresas");
      return saved ? { ...EMPRESAS_BASE, ...JSON.parse(saved) } : EMPRESAS_BASE;
    } catch(e) { return EMPRESAS_BASE; }
  });

  useEffect(() => {
    try {
      // Guardar solo las empresas que no son las base (las creadas por el usuario)
      const extras = {};
      Object.entries(empresas).forEach(([k, v]) => {
        if (!EMPRESAS_BASE[k]) extras[k] = v;
        else extras[k] = v; // también guardar cambios en empresas base (ej: clientes nuevos)
      });
      localStorage.setItem("recartify_empresas", JSON.stringify(extras));
    } catch(e) {}
  }, [empresas]);

  function agregarEmpresa(nueva){setEmpresas(prev=>({...prev,[nueva.id]:nueva}));}
  function actualizarClientes(empId,nuevos){setEmpresas(prev=>({...prev,[empId]:{...prev[empId],clientes:nuevos}}));if(empresa?.id===empId)setEmpresa(prev=>({...prev,clientes:nuevos}));}
  return empresa
    ?<AppPrincipal empresa={empresa} onLogout={()=>setEmpresa(null)} onActualizarClientes={actualizarClientes}/>
    :<LoginScreen onLogin={setEmpresa} empresas={empresas} onAgregarEmpresa={agregarEmpresa}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
